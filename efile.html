<main class="tool-wrapper">

  <div class="tool-box">

    <!-- DROPDOWN -->

<!-- JS -->
<script>
const dropdown = document.querySelector(".dropdown");
const selectedBtn = document.getElementById("selectedTool");
const options = document.querySelectorAll(".options div");

const fileInput = document.getElementById("fileInput");
const base64Input = document.getElementById("base64Input");
const output = document.getElementById("output");
const preview = document.getElementById("preview");
const copyBtn = document.getElementById("copyBtn");
const downloadBtn = document.getElementById("downloadBtn");
const processBtn = document.getElementById("processBtn");

let selectedTool = "img-encode";
function toggleNav() {
  document.getElementById("mobileNav").classList.toggle("open");
}
/* Dropdown */
selectedBtn.addEventListener("click", () => {
  dropdown.classList.toggle("open");
});

document.addEventListener("click", e => {
  if (!dropdown.contains(e.target)) dropdown.classList.remove("open");
});

/* Tool select */
options.forEach(opt => {
  opt.addEventListener("click", () => {
    selectedTool = opt.dataset.tool;
    selectedBtn.querySelector("span").textContent = opt.textContent;

    options.forEach(o => o.classList.remove("active"));
    opt.classList.add("active");

    fileInput.hidden = selectedTool.includes("decode");
    base64Input.hidden = !fileInput.hidden;

    resetUI();
    dropdown.classList.remove("open");
  });
});

/* Process */
processBtn.addEventListener("click", () => {
  resetUI();

  if (selectedTool.includes("encode")) {
    const file = fileInput.files[0];
    if (!file) return alert("Select a file");

    const reader = new FileReader();
    reader.onload = () => {
      output.value = reader.result;
      copyBtn.hidden = false;
    };
    reader.readAsDataURL(file);
  } else {
    if (!base64Input.value.trim()) return alert("Paste Base64");

    output.value = base64Input.value.trim();
    downloadBtn.hidden = false;

    if (selectedTool === "img-decode") {
      const img = document.createElement("img");
      img.src = output.value;
      preview.appendChild(img);
    }

    if (selectedTool === "audio-decode") {
      const audio = document.createElement("audio");
      audio.controls = true;
      audio.src = output.value;
      preview.appendChild(audio);
    }
  }
});

/* Copy */
copyBtn.addEventListener("click", () => {
  navigator.clipboard.writeText(output.value);
  copyBtn.textContent = "Copied!";
  setTimeout(() => copyBtn.textContent = "Copy Base64", 1200);
});

/* Download */
downloadBtn.addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = output.value;
  a.download = selectedTool === "img-decode" ? "image.png" : "audio.mp3";
  a.click();
});

/* Reset */
function resetUI() {
  output.value = "";
  preview.innerHTML = "";
  copyBtn.hidden = true;
  downloadBtn.hidden = true;
}
</script>
